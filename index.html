<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>고양이 스낵바</title>
<style>
:root{--br:#8c5c52;--cr:#fbf0d6;--cr2:#f6e3b8;--pk:#f1b0b8;--yl:#f3cf72;--gr:#a9c98a;--tx:#6b4a40;--sh:#d2b184}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#d9c19a;font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--tx);user-select:none;-webkit-user-select:none;touch-action:none}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--cr);position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#f6d9a0;border-bottom:2px solid var(--br);gap:6px}
.pill{display:flex;align-items:center;gap:5px;background:var(--cr);border:2px solid var(--br);border-radius:20px;padding:3px 10px 3px 5px;font-weight:800;font-size:15px;min-width:86px;box-shadow:0 2px 0 var(--sh)}
.pill img{width:22px;height:22px}
.plate{background:#d9a066;border:2px solid var(--br);border-radius:12px;padding:2px 12px;text-align:center;color:#fff;font-weight:800;font-size:14px;line-height:1.15;text-shadow:0 1px 0 #7a5030;box-shadow:0 2px 0 var(--sh)}
.plate small{display:block;font-size:11px;opacity:.9}
#cv{flex:1;min-height:0;width:100%;display:block;background:#bfe6a3;touch-action:none}
.tabs{display:flex;gap:4px;padding:6px 6px 0;background:#f6d9a0}
.tab{flex:1;border:2px solid var(--br);border-bottom:0;border-radius:12px 12px 0 0;background:#f3dba0;color:var(--tx);font:800 12px inherit;font-family:inherit;padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab img{width:22px;height:22px}
.tab.on{background:var(--cr);color:#d9622b}
.pre{display:none}.prep .pre{display:flex}
#dock{display:flex;gap:6px;padding:6px 8px 8px;background:#f6d9a0;border-top:2px solid var(--br)}
.prep #dock{display:none}
.dbtn{flex:1;position:relative;border:2px solid var(--br);border-radius:14px;background:var(--cr);font:800 12px inherit;font-family:inherit;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0;box-shadow:0 3px 0 var(--sh);min-height:58px}
.dbtn img{width:26px;height:26px}.dbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}
.badge{position:absolute;top:-6px;right:-4px;width:16px;height:16px;border-radius:50%;background:#ff5a5f;border:2px solid #fff;display:none}
.badge.on{display:block}
#qbtn{flex:2.6;border:2px solid var(--br);border-radius:14px;background:#fff;font-family:inherit;color:var(--tx);display:flex;align-items:center;gap:8px;padding:5px 8px;box-shadow:0 3px 0 var(--sh);text-align:left;min-height:58px;overflow:hidden;position:relative}
#qbtn.ready{background:#d9f7d4;border-color:#4e9a55;box-shadow:0 3px 0 #3d7a43}
#qbtn.ready:active{transform:translateY(2px)}
#qbtn .qp{width:34px;height:34px;flex:none;border-radius:10px;background:var(--cr2);display:flex;align-items:center;justify-content:center}
#qbtn .qp img{width:34px;height:34px}
#qbtn b{display:block;font-size:12px;line-height:1.15;white-space:nowrap}#qbtn>div:nth-child(2){min-width:0;overflow:hidden}#qbtn small{display:block;font-size:10.5px;color:#a38650}
#qbtn .qc{margin-left:auto;display:flex;align-items:center;gap:2px;font-weight:800;font-size:12px;flex:none}
#qbtn .qc img{width:16px;height:16px}
#qbtn .qbar{position:absolute;left:0;bottom:0;height:5px;background:#ffb347}
#sheet{position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--cr);border:2px solid var(--br);border-bottom:0;border-radius:22px 22px 0 0;display:none;flex-direction:column;z-index:4;box-shadow:0 -8px 20px rgba(60,40,10,.3)}
#sheet.open{display:flex}.prep #sheet{height:70%}
.x{flex:none;width:34px;height:34px;border:2px solid var(--br);border-radius:50%;background:#fff;color:var(--tx);font:800 14px inherit;font-family:inherit;align-self:center;margin:0 2px 4px 2px}.prep .x{display:none}
#sheet .tabs{border-radius:19px 19px 0 0}
#alert{position:absolute;left:10px;right:10px;bottom:84px;display:none;z-index:3}
.prep #alert{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.tile{background:#fff;border:3px solid #e8cf9f;border-radius:14px;padding:7px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;font-size:12px}
.tile.wide{grid-column:span 2;flex-direction:row;justify-content:space-between;text-align:left;gap:8px}
.tile .pic{width:44px;height:44px;flex:none;border-radius:12px;background:var(--cr2);border:2px solid #e8cf9f;display:flex;align-items:center;justify-content:center}
.tile .pic img{width:38px;height:38px}
.tile small{color:#a38650;font-size:10.5px;line-height:1.2}
.tile .tb{display:flex;gap:4px;margin-top:3px;width:100%}
.tile .tb .buy{flex:1;min-width:0;padding:6px 2px}
.tile.wide .tb{width:auto}
.rtabs{display:flex;gap:6px;margin-bottom:6px}
.rt{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:0;background:#fff;border:3px solid #e8cf9f;border-radius:14px;padding:4px 2px 5px;font-family:inherit;color:var(--tx);cursor:pointer}
.rt img{width:34px;height:34px}.rt b{font-size:13px}.rt small{font-size:10.5px;color:#a38650}
.rt.on{border-color:#ff7a59;background:#fff1e6}
.rt i{position:absolute;top:-6px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#ff5d6c;color:#fff;font:800 11px/18px inherit;font-family:inherit;font-style:normal;text-align:center;border:2px solid #fff}
.slot{background:#fff;border:3px solid #e8cf9f;border-radius:14px;padding:8px;margin-bottom:6px}
.slot.empty{border-style:dashed;background:#fff9ea}
.slot.tgt{border-color:#ff9d7a}
.slot .hd{display:flex;gap:8px;align-items:center}
.slot .no{flex:none;width:22px;height:22px;border-radius:50%;background:#d9622b;color:#fff;font:800 12px/22px inherit;font-family:inherit;text-align:center}
.slot .pic{width:44px;height:44px;flex:none;border-radius:12px;background:var(--cr2);border:3px solid #e8cf9f;display:flex;align-items:center;justify-content:center}
.slot .pic img{width:38px;height:38px}
.slot small{color:#a38650;display:block;font-size:11px;margin-top:1px}
.slot .cmp{background:#fff4e6;border-radius:10px;padding:4px 8px;margin-top:6px;font-size:11.5px;line-height:1.5}
.up{color:#2f9b4f;font-weight:800}.dn{color:#d9463b;font-weight:800}
.slot .btns{margin-top:6px;justify-content:flex-start}
.mgbar{display:inline-block;width:54px;height:6px;border-radius:3px;background:#f0e2c4;vertical-align:middle;margin:0 4px;overflow:hidden}.mgbar i{display:block;height:100%;background:#b57edc}
.mc{background:#fff;border:3px solid #e8cf9f;border-radius:12px;padding:5px 3px;text-align:center;font-size:11px;position:relative;cursor:pointer}
.mc.sel{border-color:#ff7a59;background:#fff1e6;box-shadow:0 0 0 2px #ffd1bd}
.mc .pic{width:42px;height:42px;margin:0 auto 2px;border-radius:11px;background:var(--cr2);border:3px solid #e8cf9f;display:flex;align-items:center;justify-content:center}
.mc .pic img{width:36px;height:36px}.mc small{display:block;color:#a38650;font-size:10px}
.note{background:#fff0d0;border:3px solid #f0cf86;border-radius:12px;padding:6px 9px;margin-bottom:6px;font-size:12px;line-height:1.35}
#toast{position:absolute;left:14px;right:14px;top:58px;background:#fff;border:2px solid var(--br);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;z-index:8;display:none;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.pill small{font-size:10px;color:#a38650;margin-left:1px}
#list{flex:1;overflow:auto;padding:6px 8px;touch-action:pan-y;background:var(--cr)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;margin-bottom:6px;background:#fff;border:3px solid #e8cf9f;border-radius:14px;font-size:13px}
.row .l{display:flex;align-items:center;gap:8px;min-width:0}
.row small{color:#a38650;display:block;font-size:11px;margin-top:1px}
.row .pic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--cr2);border:2px solid #e8cf9f;display:flex;align-items:center;justify-content:center}
.row .pic img{width:34px;height:34px}
.btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.buy{min-width:72px;border:2px solid var(--br);border-radius:12px;background:var(--yl);color:#5a3d08;font:800 12px inherit;font-family:inherit;padding:6px 6px;box-shadow:0 3px 0 #b8893c;display:flex;align-items:center;justify-content:center;gap:3px}
.buy img{width:15px;height:15px}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #b8893c}
.buy:disabled{background:#e8dfc9;color:#a99c7c;border-color:#c4b79a;box-shadow:none}
.buy.pk{background:var(--pk);box-shadow:0 3px 0 #d98aa0;color:#6b2535}
.sec{font-size:13px;font-weight:800;color:#d9622b;margin:8px 2px 4px;display:flex;align-items:center;gap:5px}
.sec img{width:18px;height:18px}
.chip{display:inline-block;border-radius:8px;padding:0 6px;font-size:10px;font-weight:800;color:#fff;margin-right:3px;border:2px solid rgba(0,0,0,.18)}
.warn{background:#fff0d0;border:3px solid #ffb347;border-radius:12px;padding:6px 8px;margin:0 0 6px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:6px}
#next{display:none;margin:8px 10px 10px;border:2px solid var(--br);border-radius:16px;padding:13px;font:800 18px inherit;font-family:inherit;background:#ff8a65;color:#fff;box-shadow:0 4px 0 #b5553a;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.prep #next{display:block}
.ov{position:absolute;inset:0;background:rgba(90,60,30,.62);display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
.card{background:var(--cr);border:4px solid var(--br);border-radius:22px;padding:16px;width:100%;max-height:94%;overflow:auto;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.card h1,.card h2{margin:0 0 4px}.card p{margin:4px 0 8px;font-size:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.stat div{background:#fff;border:3px solid #e8cf9f;border-radius:12px;padding:7px;font-size:14px}
.big{display:block;width:100%;border:2px solid var(--br);border-radius:16px;padding:12px;font:800 18px inherit;font-family:inherit;background:var(--yl);color:#5a3d08;box-shadow:0 4px 0 #b8893c;margin-top:10px}
.big:active{transform:translateY(2px)}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px;text-align:left}
.dex div{background:#fff;border:2px solid #e8cf9f;border-radius:10px;padding:4px 6px;display:flex;align-items:center;gap:5px}
.dex img{width:30px;height:30px}
.gcard{border:5px solid;border-radius:18px;padding:12px;margin:8px 0;background:#fff}
.gcard img.big-pet{width:96px;height:96px}
.bell{width:90px;height:90px;animation:sh .15s infinite alternate}
@keyframes sh{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.stat img,.card p img{width:24px;height:24px;vertical-align:middle}
.logo{font-size:26px;font-weight:800;color:#d9622b;text-shadow:0 2px 0 #fff}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="pill"><img id="ic-coin"><span id="money">0</span></div><div class="plate"><span id="dayinfo">1일차</span><small id="shopname"></small></div><div class="pill" id="bellpill"><img id="ic-bell"><span id="bells">0</span><small>뽑기</small></div></div>
  <canvas id="cv"></canvas>
  <div id="alert"></div>
  <div id="dock">
    <button id="qbtn"></button>
    <button class="dbtn" data-open="staff"><img data-i="paw">직원<i class="badge" id="b-staff"></i></button>
    <button class="dbtn" data-open="shop"><img data-i="shop">가게<i class="badge" id="b-shop"></i></button>
    <button class="dbtn" data-open="me"><img data-i="me">나<i class="badge" id="b-me"></i></button>
  </div>
  <div id="sheet">
    <div class="tabs" id="tabs">
      <button class="tab pre" data-t="order"><img data-i="crate">발주</button><button class="tab pre" data-t="menu"><img data-i="book">메뉴</button>
      <button class="tab on" data-t="staff"><img data-i="paw">직원</button><button class="tab" data-t="shop"><img data-i="shop">가게</button><button class="tab" data-t="me"><img data-i="me">나</button>
      <button class="x" id="sx">✕</button>
    </div>
    <div id="list"></div>
    <button id="next">▶ 다음 날 영업 시작</button>
  </div>
  <div id="toast"></div>
  <div class="ov" id="ov"><div class="card" id="card"></div></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const rf=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[rnd(a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cv=$('cv'),ctx=cv.getContext('2d');
const LW=360,LH=520;
let DPR=1,CW=0,CH=0,SC=1,OX=0,OY=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);const pr=document.getElementById('app').classList.contains('prep');SC=(pr?CW/LW:Math.min(CW/LW,CH/LH))||1;OX=(CW-LW*SC)/2;OY=pr?-112*SC:(CH-LH*SC)/2;}
window.addEventListener('resize',resize);
function fmt(n){n=Math.floor(n);if(n<1000)return String(n);const u=['K','M','B','T'];let i=-1,v=n;while(v>=1000&&i<u.length-1){v/=1000;i++;}return(v<10?v.toFixed(2):v<100?v.toFixed(1):v.toFixed(0))+u[i];}

/* =========================== 그래픽 =========================== */
const OUT='#74503f';let TONE=0;
const hz=(a,b)=>{const v=Math.sin(a*12.9898+b*78.233)*43758.5453;return v-Math.floor(v)-0.5;};
function hx(c){if(c.length===4)c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mix(a,b,t){const A=hx(a),B=hx(b);return'#'+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0')).join('');}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function st(g,lw,col){g.lineWidth=(lw==null?2.2:lw)*0.55;g.strokeStyle=col||OUT;g.lineJoin='round';g.lineCap='round';if(g.lineWidth>0)g.stroke();}
function smooth(g,p){const n=p.length;g.moveTo((p[0][0]+p[n-1][0])/2,(p[0][1]+p[n-1][1])/2);for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}g.closePath();}
function stb(g,x,y,w,h,lw,col){
  if(TONE){const wd=Math.min(2.9,Math.min(w,h)*0.42);g.save();g.lineJoin='round';g.lineCap='round';g.strokeStyle='#7b5040';g.lineWidth=wd;g.stroke();g.translate(0.45,0.35);g.globalAlpha=0.5;g.lineWidth=wd*0.55;g.stroke();g.restore();return;}
  if(Math.min(w,h)<7){st(g,lw,col);return;}
  const b=(lw==null?2.2:lw)*0.55;col=col||OUT;
  g.save();g.lineJoin='round';g.lineCap='round';g.strokeStyle=col;
  g.lineWidth=b*0.92;g.stroke();
  [[0.95,1.3],[1.35,1.65]].forEach(q=>{const t=q[0],P=new Path2D();P.moveTo(x+w*1.25,y+h*(t-1.25));P.lineTo(x+w*1.25,y+h*1.25);P.lineTo(x+w*(t-1.25),y+h*1.25);P.closePath();g.save();g.clip(P);g.lineWidth=b*q[1];g.stroke();g.restore();});
  g.restore();
}
function ell(g,x,y,rx,ry,fill,lw){g.beginPath();if(Math.min(rx,ry)>2.6){const n=18,pts=[];for(let i=0;i<n;i++){const a=i/n*6.2832,k=1+hz(x*1.7+i,y*1.3+rx)*(TONE?0.085:0.06);pts.push([x+Math.cos(a)*rx*k,y+Math.sin(a)*ry*k]);}smooth(g,pts);}else g.ellipse(x,y,rx,ry,0,0,6.2832);if(fill){g.fillStyle=fill;g.fill();}if(lw!==0)stb(g,x-rx,y-ry,2*rx,2*ry,lw,(TONE&&typeof fill==='string'&&fill[0]==='#')?mix(fill,'#6a4a3c',.5):undefined);}
function rrp(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function rrPts(x,y,w,h,r){r=Math.min(r,w/2,h/2);const P=[],a=Math.min(.6,Math.min(w,h)*0.03);const j=(px,py)=>[px+hz(px*1.7,py*0.9)*a*2,py+hz(py*1.3,px*0.7)*a*2];
  const arc=(cx,cy,a0)=>{for(let i=0;i<=3;i++){const t=a0+i*Math.PI/6;P.push(j(cx+Math.cos(t)*r,cy+Math.sin(t)*r));}};
  arc(x+w-r,y+r,-Math.PI/2);P.push(j(x+w,y+h/2));arc(x+w-r,y+h-r,0);P.push(j(x+w/2,y+h));arc(x+r,y+h-r,Math.PI/2);P.push(j(x,y+h/2));arc(x+r,y+r,Math.PI);P.push(j(x+w/2,y));return P;}
function rrr(g,x,y,w,h,r,fill,lw,col){if(Math.min(w,h)<7||r<2)rrp(g,x,y,w,h,r);else{g.beginPath();smooth(g,rrPts(x,y,w,h,r));}
  if(fill){g.fillStyle=fill;g.fill();}
  if(lw!==0)stb(g,x,y,w,h,lw||2,col);}
function poly(g,pts,fill,lw){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(lw!==0){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pts.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});stb(g,x0,y0,x1-x0,y1-y0,lw);}}
const SP={};
function sprite(key,size,fn,design){if(!SP[key]){const c=mk(size,size),g=c.getContext('2d');g.scale(size/(design||80),size/(design||80));fn(g);SP[key]=c;}return SP[key];}
const urlCache={};
function url(c,key){return urlCache[key]||(urlCache[key]=c.toDataURL());}

/* --- 고양이 --- */
const FURS=[
 {b:'#f6bd78',s:'orange',tab:'#e19a4c',mz:'#fff3e0',paw:'#f6bd78'},
 {b:'#fff8ee',s:'cream',pa:[['#f6bd78',16,29,7,7],['#f6bd78',64,29,5,6]],paw:'#fff8ee'},
 {b:'#fff8ee',s:'blue',pa:[['#a9bbd8',19,40,15,10],['#a9bbd8',64,29,5,6]],paw:'#fff8ee'},
 {b:'#fff8ee',s:'brown',pa:[['#b9a59b',62,40,13,10],['#b9a59b',17,29,5,6]],paw:'#fff8ee'},
 {b:'#fff8ee',s:'calico',pa:[['#f6bd78',23,40,14,9],['#b9a59b',58,42,11,8]],paw:'#fff8ee'},
 {b:'#f7ead5',s:'siamese',pa:[['#b9906a',15,29,7,7],['#b9906a',65,29,7,7],['rgba(176,138,104,.5)',40,55,14,8]],paw:'#d9bd98'}];
const CRAY='#7b5040';
function faceBits(g,expr,ey,dark,eyeCol){
  const ec=eyeCol||'#5a3a30';

const player={x:180,y:330,carry:[],act:0,dir:1};
const reg={cat:null,prog:0};
seats=SEATP.map(p=>({x:p.x,y:p.y,tx:p.tx,ty:p.ty,cat:null,tip:0,dirty:false,clean:0}));
let BG=null;
function syncStations(){while(stations.length<S.stations){const i=stations.length;stations.push({x:STX[i],y:462,job:null,done:null,prog:0});}BG=null;}
function syncActors(){
  const keep=actors.slice();actors=[];
  RKEYS.forEach(r=>{S.deployed[r].forEach(id=>{
    const c=cardById(id);if(!c)return;
    let a=keep.find(k=>k.card.id===id);
    if(!a){const h={cook:[180,450],hall:[180,260],cleaner:[180,330]}[r];a={card:c,role:r,x:180,y:130,carry:[],act:0,home:h,tx:h[0],ty:h[1],dir:1};}
    a.card=c;actors.push(a);
  });});
}
syncStations();syncActors();
function resetDay(){
  cats=[];jobs=[];shelf=[];texts=[];puffs=[];t=0;spawnT=2;closeT=0;reg.cat=null;reg.prog=0;
  seats.forEach(s=>{s.cat=null;s.tip=0;s.dirty=false;s.clean=0;});
  stations.forEach(s=>{s.job=null;s.done=null;s.prog=0;});
  player.x=180;player.y=330;player.carry=[];
  actors.forEach(a=>{a.carry=[];a.x=180;a.y=130;});
  D={earned:0,finished:0,happy:0,angry:0,lost:0};
  if((S.stock.milk||0)<8)S.stock.milk=8;
}
const alive=c=>c&&!c.dead&&!c.gone;
function boardTypes(){return S.board.filter(k=>S.dev.indexOf(k)>=0);}
const goalOf=d=>Math.round(60*Math.pow(1.35,d-1));
const spawnInt=d=>Math.max(2.4,6.2-0.3*((d||S.day)-1))/(1+0.03*S.rep);
const title=()=>{let r=TITLES[0][1];TITLES.forEach(x=>{if(S.rep>=x[0])r=x[1];});return r;};

/* ---------- 손님 ---------- */
function spawnCat(){
  if(cats.filter(c=>c.state==='toQueue'||c.state==='queue').length>=4)return;
  const bt=boardTypes(),idn=pick(CATS),grp=Math.random()<Math.min(0.3,0.08+0.04*S.day),n=grp?3+rnd(2):1+(Math.random()<0.35?1:0)+(S.day>3&&Math.random()<0.25?1:0);
  const need=[];
  if(bt.indexOf(idn[1])>=0&&Math.random()<0.5)need.push(idn[1]);
  while(need.length<n)need.push(pick(bt));
  cats.push({id:catId++,x:180,y:-110,ident:idn,expr:'normal',state:'toQueue',need:need,group:grp,order:need.slice(),base:need.reduce((s,k)=>s+MENU[k].price,0),seat:null,pat:25,max:25,eat:0,wp:[],heat:[]});
}
function freeSeat(){for(let i=0;i<S.seats;i++){const s=seats[i];if(!s.cat&&!s.dirty)return s;}return null;}
function moveTo(o,tx,ty,sp,dt){const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);if(d<=sp*dt+0.5){o.x=tx;o.y=ty;return true;}o.x+=dx/d*sp*dt;o.y+=dy/d*sp*dt;if(Math.abs(dx)>1)o.dir=dx>0?1:-1;return false;}
function dropCat(c){jobs=jobs.filter(j=>j.cat!==c);shelf=shelf.filter(j=>j.cat!==c);}
function angryLeave(c){
  c.state='leaving';c.expr='angry';c.wp=leaveWP(c.seat);D.angry++;dropCat(c);
  if(c.seat){c.seat.cat=null;c.seat=null;}if(reg.cat===c){reg.cat=null;reg.prog=0;}
}
function updateCats(dt){
  if(phase==='day'){spawnT-=dt;if(spawnT<=0){spawnCat();spawnT=spawnInt();}}
  const q=cats.filter(c=>c.state==='toQueue'||c.state==='queue').sort((a,b)=>a.id-b.id);
  q.forEach((c,i)=>{
    const ty=90-i*26;
    if(moveTo(c,180,ty,95,dt)&&c.state==='toQueue')c.state='queue';
    if(c.state==='queue'){
      c.pat-=dt;c.expr=c.pat<c.max*0.3?'sad':'normal';
      if(c.pat<=0){c.state='leaving';c.expr='sad';c.wp=[[180,-110]];D.lost++;return;}
      if(i===0&&!reg.cat){const s=freeSeat();if(s){s.cat=c;c.seat=s;reg.cat=c;reg.prog=0;c.state='toCounter';c.wp=[[180,126],[180,ORD.y],[ORD.x,ORD.y]];}}
    }
  });
  cats.forEach(c=>{
    if(c.state==='toCounter'||c.state==='toSeat'||c.state==='leaving'){
      const w=c.wp[0];
      if(w&&moveTo(c,w[0],w[1],100,dt)){c.wp.shift();if(!c.wp.length){
        if(c.state==='toCounter')c.state='ordering';
        else if(c.state==='toSeat'){c.state='waiting';c.pat=45;c.max=45;}
        else c.gone=true;}}
    }else if(c.state==='waiting'){
      c.pat-=dt;c.expr=c.pat<c.max*0.3?'sad':'normal';
      if(!c.need.length){c.state='eating';c.eat=2.5;c.expr='eat';}
      else if(c.pat<=0)angryLeave(c);
    }else if(c.state==='eating'){
      c.eat-=dt;
      if(c.eat<=0){
        const f=c.pat/c.max,fav=c.order.indexOf(c.ident[1])>=0;
        const hv=c.heat.length?c.heat.reduce((x,y)=>x+y,0)/c.heat.length:1;
        const tip=f<0.2?0:Math.round(c.base*0.5*f*(fav?1.5:1)*(0.5+0.5*hv));
        const s=c.seat;s.cat=null;s.tip=tip;s.dirty=true;c.seat=null;
        c.state='leaving';c.expr='happy';c.wp=leaveWP(s);
        D.finished++;if(f>=0.35)D.happy++;S.served++;
        S.dex[c.ident[0]]=(S.dex[c.ident[0]]||0)+1;
      }
    }
  });
  cats=cats.filter(c=>!c.gone);
}
function finishOrder(c){
  S.money+=c.base;D.earned+=c.base;addText(REG.x+30,REG.y-18,'+'+fmt(c.base),'#ffe27a',true);
  c.need.forEach(k=>jobs.push({id:jid++,type:k,cat:c}));
  c.state='toSeat';c.wp=approach(c.seat);reg.cat=null;reg.prog=0;
}

/* ---------- 상호작용 ---------- */
const near=(a,x,y,r)=>Math.hypot(a.x-x,a.y-y)<r;
function addText(x,y,s,col,coin){texts.push({x:x,y:y,s:s,col:col||'#fff',life:0.9,coin:!!coin});}
function canDo(a,k){if(a===player)return true;const r=a.role;return(k==='cook'&&r==='cook')||((k==='order'||k==='pick'||k==='serve')&&r==='hall')||(k==='clean'&&r==='cleaner');}
const mul=a=>a===player?pHand():cSkl(a.card);
const capOf=a=>a===player?pCap():hallCap(a.card);
const allActors=()=>[player].concat(actors);
function workStations(dt){
  const all=allActors();
  stations.forEach(s=>{
    let op=0;all.forEach(a=>{if(canDo(a,'cook')&&near(a,s.x,s.y-28,40))op+=mul(a);});
    if(s.job&&!alive(s.job.cat)){s.job=null;s.prog=0;}
    if(!s.job&&!s.done&&op>0){
      const i=jobs.findIndex(j=>S.stock[MENU[j.type].ing]>0);
      if(i>=0){s.job=jobs.splice(i,1)[0];S.stock[MENU[s.job.type].ing]--;s.prog=0;}
    }
    if(s.job&&op>0){s.prog+=dt*op;if(Math.random()<dt*6)puffs.push({x:s.x+rf(-8,8),y:s.y-10,life:0.9});if(s.prog>=MENU[s.job.type].time){s.done=s.job;s.job=null;s.prog=0;}}
    if(s.done&&shelf.length<6){s.done.ready=t;shelf.push(s.done);s.done=null;}
  });
  let op=0;all.forEach(a=>{if(canDo(a,'order')&&near(a,REG.x,REG.y,44))op+=mul(a);});
  if(reg.cat&&reg.cat.state==='ordering'&&op>0){reg.prog+=dt*op;if(reg.prog>=1.6)finishOrder(reg.cat);}
}
/* 음식은 종류만 맞으면 어느 손님에게든 줄 수 있어요. 원래 주인의 주문은 이 손님 몫과 맞바꿔요 */
function swapJob(j,to){
  const from=j.cat,k=j.type;let other=null;
  const chk=o=>{if(!other&&o&&o.cat===to&&o.type===k&&o!==j)other=o;};
  jobs.forEach(chk);shelf.forEach(chk);stations.forEach(s=>{chk(s.job);chk(s.done);});allActors().forEach(a=>a.carry.forEach(chk));
  if(other)other.cat=from;
  j.cat=to;
}
function interact(a,dt){
  a.act-=dt;
  a.carry=a.carry.filter(j=>alive(j.cat)&&j.cat.state!=='leaving');
  if(canDo(a,'pick')&&a.act<=0&&a.carry.length<capOf(a)&&near(a,SHELF.x,SHELF.y,40)&&(a===player||!near(player,SHELF.x,SHELF.y,64))){
    const i=shelf.findIndex(j=>alive(j.cat));
    if(i>=0){a.carry.push(shelf.splice(i,1)[0]);a.act=0.1;}
  }
  for(const s of seats){
    if(!near(a,s.tx,s.ty,40))continue;
    if(canDo(a,'serve')&&a.act<=0&&s.cat&&s.cat.state==='waiting'){
      let i=a.carry.findIndex(j=>j.cat===s.cat);
      if(i<0&&(a===player||!near(player,s.tx,s.ty,46)))i=a.carry.findIndex(j=>s.cat.need.indexOf(j.type)>=0);
      if(i>=0){const j=a.carry.splice(i,1)[0];if(j.cat!==s.cat)swapJob(j,s.cat);s.cat.heat.push(clamp(1-(t-(j.ready||t))/30,0,1));const k=s.cat.need.indexOf(j.type);if(k>=0)s.cat.need.splice(k,1);a.act=0.1;addText(s.cat.x,s.cat.y-34,'♥','#ff7f9f');}
    }
    if(canDo(a,'clean')&&s.dirty&&(a===player||!near(player,s.tx,s.ty,50))){
      s.clean+=dt*mul(a);
      if(s.clean>=0.9){const v=Math.round(s.tip*(a===player?1:cTip(a.card)));S.money+=v;D.earned+=v;if(v>0)addText(s.tx,s.ty-16,'+'+fmt(v),'#ffe27a',true);s.tip=0;s.dirty=false;s.clean=0;}
    }
  }
}

/* ---------- 직원 AI ---------- */
function deliverTarget(a){
  let bd=1e9,bs=null;a.carry.forEach(j=>{const s=j.cat.seat;if(!s)return;const d=Math.hypot(a.x-s.tx,a.y-s.ty);if(d<bd){bd=d;bs=s;}});
  return bs?[bs.tx,bs.ty]:null;
}
function aiStaff(a){
  let tg=a.home;const r=a.role;
  if(r==='cook'){
    let best=null,bs=1e9;
    stations.forEach((s,i)=>{
      if(!(s.job||s.done||jobs.length))return;
      if(near(player,s.x,s.y-28,50))return;
      let others=0;actors.forEach(o=>{if(o!==a&&o.role==='cook'&&o.si===i)others++;});
      const sc=others*10+(s.job?0:2)+Math.hypot(a.x-s.x,a.y-s.y)*0.01;
      if(sc<bs){bs=sc;best=i;}
    });
    a.si=best;if(best!==null)tg=[stations[best].x,stations[best].y-28];
  }else if(r==='hall'){
    const cap=hallCap(a.card),pAtShelf=near(player,SHELF.x,SHELF.y,64),has=!pAtShelf&&shelf.some(j=>alive(j.cat));
    const ordering=reg.cat&&(reg.cat.state==='ordering'||reg.cat.state==='toCounter')&&!near(player,REG.x,REG.y,60);
    const taken=actors.some(o=>o!==a&&o.role==='hall'&&o.atReg);
    a.atReg=false;
    const del=deliverTarget(a);
    if(a.carry.length&&del&&(a.carry.length>=cap||!has))tg=del;
    else if(ordering&&!taken&&!a.carry.length){tg=HREG;a.atReg=true;}
    else if(has&&a.carry.length<cap)tg=[SRV.x,SRV.y];
    else if(a.carry.length&&del)tg=del;
    else if(ordering&&!taken){tg=HREG;a.atReg=true;}
  }else if(r==='cleaner'){
    let bd=1e9,bs=null;seats.forEach(s=>{if(!s.dirty||near(player,s.tx,s.ty,56))return;let tk=false;actors.forEach(o=>{if(o!==a&&o.role==='cleaner'&&o.ts===s)tk=true;});if(tk)return;const d=Math.hypot(a.x-s.tx,a.y-s.ty);if(d<bd){bd=d;bs=s;}});
    a.ts=bs;if(bs)tg=[bs.tx,bs.ty];
  }
  a.tx=tg[0];a.ty=tg[1];
}

/* ---------- 입력 ---------- */
const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;});window.addEventListener('keyup',e=>{keys[e.code]=false;});
const joy={on:false,ox:0,oy:0,x:0,y:0,id:null};let dbgDir=null;
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();joy.on=true;joy.id=e.pointerId;joy.ox=joy.x=e.clientX-r.left;joy.oy=joy.y=e.clientY-r.top;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;const r=cv.getBoundingClientRect();joy.x=e.clientX-r.left;joy.y=e.clientY-r.top;});
const endJoy=e=>{if(e.pointerId===joy.id)joy.on=false;};cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
function inputDir(){
  if(dbgDir)return dbgDir;
  let x=0,y=0;if(keys.KeyA||keys.ArrowLeft)x--;if(keys.KeyD||keys.ArrowRight)x++;if(keys.KeyW||keys.ArrowUp)y--;if(keys.KeyS||keys.ArrowDown)y++;
  if(x||y){const l=Math.hypot(x,y);return[x/l,y/l];}
  if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>8){const m=Math.min(1,d/40);return[dx/d*m,dy/d*m];}}
  return[0,0];
}

/* ---------- 업데이트 ---------- */
function step(dt){
  if(phase!=='day'&&phase!=='closing')return;
  t+=dt;
  const dir=inputDir();
  player.x=clamp(player.x+dir[0]*pSpeed()*dt,BOUND.x0,BOUND.x1);player.y=clamp(player.y+dir[1]*pSpeed()*dt,BOUND.y0,BOUND.y1);
  if(Math.abs(dir[0])>0.1)player.dir=dir[0]>0?1:-1;
  actors.forEach(a=>{aiStaff(a);moveTo(a,a.tx,a.ty,cSpd(a.card),dt);if(a.role==='cook')a.y=Math.max(a.y,425);});
  workStations(dt);
  allActors().forEach(a=>interact(a,dt));
  updateCats(dt);
  texts.forEach(x=>{x.life-=dt;x.y-=22*dt;});texts=texts.filter(x=>x.life>0);
  puffs.forEach(p=>{p.life-=dt;p.y-=18*dt;});puffs=puffs.filter(p=>p.life>0);
  if(phase==='day'&&t>=DAY_LEN){
    phase='closing';closeT=0;addText(180,200,'마감!','#fff');
    cats.forEach(c=>{if(c.state==='toQueue'||c.state==='queue'){c.state='leaving';c.expr='sad';c.wp=[[180,-110]];D.lost++;}});
  }
  if(phase==='closing'){
    closeT+=dt;
    const inside=cats.some(c=>c.state==='toCounter'||c.state==='ordering'||c.state==='toSeat'||c.state==='waiting'||c.state==='eating');
    if(!inside||closeT>30)endDay();
  }
  saveT-=dt;if(saveT<=0){persist();saveT=3;}
}

/* =========================== 배경 =========================== */

const MX=160,MT=130,MB=140;
const FOL='#5c4a38';
function blobPath(g,cx,cy,rx,ry,seed){const n=22,p=[];for(let i=0;i<n;i++){const a=i/n*6.2832,k=1+hz(seed+i*1.37,seed*0.7)*0.26;p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k]);}g.beginPath();smooth(g,p);}
function crown(g,cx,cy,rx,ry,seed,fill,dark){
  const m=Math.min(rx,ry),n=Math.max(9,Math.round((rx+ry)*0.4)),cs=[];
  for(let i=0;i<n;i++){const a=i/n*6.2832+hz(seed,i)*0.18,r=m*(0.36+hz(seed+i,2)*0.1);cs.push([cx+Math.cos(a)*(rx-r*0.6),cy+Math.sin(a)*(ry-r*0.6),r]);}
  const all=cs.concat([[cx,cy,m*0.78],[cx-rx*.32,cy,m*.62],[cx+rx*.32,cy,m*.62]]);
  g.fillStyle=FOL;all.forEach(c=>{g.beginPath();g.arc(c[0],c[1],c[2]+1.5,0,6.2832);g.fill();});
  g.fillStyle=fill;all.forEach(c=>{g.beginPath();g.arc(c[0],c[1],c[2],0,6.2832);g.fill();});
  const P=new Path2D();all.forEach(c=>{P.moveTo(c[0]+c[2],c[1]);P.arc(c[0],c[1],c[2],0,6.2832);});
  g.save();g.clip(P);g.fillStyle=dark;
  cs.forEach(c=>{if(c[1]>cy-ry*0.1){g.beginPath();g.arc(c[0]-c[2]*0.1,c[1]-c[2]*0.28,c[2]*0.94,0,6.2832);g.fill();}});
  g.beginPath();g.ellipse(cx+rx*0.12,cy+ry*0.6,rx*0.85,ry*0.42,0,0,6.2832);g.fill();
  g.restore();
  g.lineCap='round';cs.forEach((c,i)=>{const a=Math.atan2(c[1]-cy,c[0]-cx);g.beginPath();g.arc(c[0],c[1],c[2]*0.6,a+2.4,a+3.9);g.lineWidth=1;g.strokeStyle='rgba(70,60,40,.75)';g.stroke();if(i%2===0){g.beginPath();g.moveTo(c[0]-Math.cos(a)*c[2]*.2,c[1]-Math.sin(a)*c[2]*.2);g.lineTo(c[0]-Math.cos(a)*c[2]*.55,c[1]-Math.sin(a)*c[2]*.55);g.stroke();}});
}
function tree(g,x,y,r){
  ell(g,x+r*.1,y+r*1.28,r*1.0,r*0.22,'rgba(90,110,60,.28)',0);
  poly(g,[[x-r*.17,y],[x-r*.22,y+r*1.05],[x-r*.5,y+r*1.28],[x+r*.5,y+r*1.28],[x+r*.22,y+r*1.05],[x+r*.17,y]],'#cdb872',1.8,FOL);
  g.beginPath();g.moveTo(x-r*.05,y+r*.5);g.quadraticCurveTo(x+r*.1,y+r*.8,x,y+r*1.1);g.moveTo(x+r*.08,y+r*.4);g.quadraticCurveTo(x+r*.16,y+r*.6,x+r*.1,y+r*.8);g.lineWidth=1;g.strokeStyle='#96803f';g.stroke();
  crown(g,x,y-r*0.1,r*1.05,r*0.88,x*0.13+y*0.07,'#7aa264','#678d54');
}
function bush(g,x,y,r,fl){
  ell(g,x,y+r*0.85,r*1.1,r*0.22,'rgba(90,110,60,.26)',0);
  crown(g,x,y,r*1.1,r*0.85,x*0.1+y*0.05,'#82a96a','#6d9558');
  if(fl)[[-0.5,-0.1],[0.3,-0.4],[0.65,0.12],[-0.05,0.3]].forEach((q,i)=>flower(g,x+r*q[0],y+r*q[1],r*0.2,['#f4c3c8','#fbeab0','#ffffff','#f1b0c4'][i]));
}
function flower(g,x,y,r,col){for(let a=0;a<5;a++){const an=a*1.2566;ell(g,x+Math.cos(an)*r,y+Math.sin(an)*r,r*0.75,r*0.75,col,1);}ell(g,x,y,r*0.55,r*0.55,'#f0c860',0.9);}
function dandy(g,x,y,r){
  ell(g,x,y+r*1.05,r*0.9,r*0.28,'rgba(90,110,60,.22)',0);
  const cs=[];for(let i=0;i<9;i++){const a=i/9*6.2832;cs.push([x+Math.cos(a)*r*0.62,y+Math.sin(a)*r*0.62,r*0.4]);}cs.push([x,y,r*0.62]);
  g.fillStyle='#8a6a2a';cs.forEach(c=>{g.beginPath();g.arc(c[0],c[1],c[2]+1.1,0,6.2832);g.fill();});g.fillStyle='#f4d24e';cs.forEach(c=>{g.beginPath();g.arc(c[0],c[1],c[2],0,6.2832);g.fill();});
  g.lineCap='round';for(let i=0;i<6;i++){const a=i/6*6.2832+0.3;g.beginPath();g.arc(x+Math.cos(a)*r*0.3,y+Math.sin(a)*r*0.3,r*0.26,a+1.6,a+3.4);g.lineWidth=0.9;g.strokeStyle='#d9a82e';g.stroke();}
}
function clover(g,x,y,sc){
  [[-90],[30],[150]].forEach(q=>{const a=q[0]*Math.PI/180,lx=x+Math.cos(a)*sc*0.62,ly=y+Math.sin(a)*sc*0.62;ell(g,lx,ly,sc*0.5,sc*0.46,'#87b574',1.2,'#4f6f45');

  const out=[],dep=deployedIds();
  S.roster.filter(c=>dep.indexOf(c.id)<0).forEach(c=>{const arr=S.deployed[c.role];if(arr.length<ROLES[c.role].max)out.push({tier:0,id:'dp:'+c.id+':'+arr.length,label:c.name+' 배치',sub:ROLES[c.role].n+' · '+GR[c.grade].n,pic:petURL(ROLES[c.role].pet),cost:deployCost(c),tab:'staff'});});
  if(S.seats<6)out.push({tier:1,id:'seat',label:'좌석 추가',sub:'손님 자리 +1',pic:iconURL('shop'),cost:S.seats===4?80:160,tab:'shop'});
  if(S.stations<MAXSTN)out.push({tier:1,id:'stn',label:'조리대 추가',sub:'동시에 요리',pic:iconURL('crate'),cost:cost(70,2.4,S.stations-1),tab:'shop'});
  [['spd','이동 속도',8],['carry','들 수 있는 개수',4],['hand','손재주',8]].forEach(d=>{const lv=S.up[d[0]];if(lv<d[2])out.push({tier:2,id:'u:'+d[0],label:d[1]+' 업',sub:'내 능력 Lv'+lv+'→'+(lv+1),pic:catURL(0,'normal',true),cost:cost(d[0]==='carry'?30:20,d[0]==='carry'?1.8:1.6,lv),tab:'me'});});
  RKEYS.forEach(r=>S.deployed[r].forEach(id=>{const c=cardById(id);if(!c)return;const pic=petURL(ROLES[r].pet);
    if(c.up.spd<6)out.push({tier:2,id:'su:'+id+':spd',label:c.name+' 이동 업',sub:ROLES[r].n,pic:pic,cost:cost(30,1.7,c.up.spd),tab:'staff'});
    if(c.up.skl<6)out.push({tier:2,id:'su:'+id+':skl',label:c.name+' 능력 업',sub:ROLES[r].n+' · '+ROLES[r].sk,pic:pic,cost:cost(40,1.8,c.up.skl),tab:'staff'});
    if(r==='hall'&&(c.up.cap||0)<3)out.push({tier:2,id:'su:'+id+':cap',label:c.name+' 개수 업',sub:'홀 직원 · 들 수 있는 개수',pic:pic,cost:cost(60,2,c.up.cap||0),tab:'staff'});}));
  return out;
}
let lastDock='',quickId=null;
function updateDock(){
  if(phase!=='day'&&phase!=='closing')return;
  const q=quickItems(),aff=q.filter(i=>S.money>=i.cost).sort((a,b)=>a.tier-b.tier||a.cost-b.cost),best=aff[0];
  const tgt=q.slice().sort((a,b)=>a.cost-b.cost)[0];
  let h,cls='';quickId=null;
  if(best){quickId=best.id;cls='ready';h='<div class="qp"><img src="'+best.pic+'"></div><div><b>'+best.label+'</b><small>'+best.sub+'</small></div><div class="qc">'+coinB(fmt(best.cost))+'</div>';}
  else if(tgt){h='<div class="qp"><img src="'+tgt.pic+'"></div><div><b>다음: '+tgt.label+'</b><small>'+tgt.sub+'</small></div><div class="qc">'+coinB(fmt(tgt.cost))+'</div><div class="qbar" style="width:'+Math.min(100,S.money/tgt.cost*100)+'%"></div>';}
  else h='<div><b>모두 구매했어요!</b></div>';
  const key=cls+h;if(key!==lastDock){lastDock=key;$('qbtn').className=cls;$('qbtn').innerHTML=h;}
  $('b-staff').classList.toggle('on',S.bells>=2||q.some(i=>i.tab==='staff'&&S.money>=i.cost));
  $('b-shop').classList.toggle('on',q.some(i=>i.tab==='shop'&&S.money>=i.cost));
  $('b-me').classList.toggle('on',q.some(i=>i.tab==='me'&&S.money>=i.cost));
  const mi=missingIng(),al=$('alert');
  if(mi.length){const g=mi[0],c=ING[g].c*15;al.style.display='block';al.innerHTML='<div class="warn"><span>⚠️ '+ING[g].n+' 재료가 떨어졌어요!</span><button class="buy" data-id="em:'+g+'"'+(S.money<c?' disabled':'')+'>긴급 ×5 '+coinB(c)+'</button></div>';}
  else al.style.display='none';
}
function setTabs(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===tab));}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;tab=b.dataset.t;setTabs();lastHTML='';renderList(true);});
let relPend=null,mgPend=null,selRole='cook',selCard=null;
function bankN(){const d=deployedIds();return S.roster.filter(c=>d.indexOf(c.id)<0).length;}
function pull(role){
  if(phase!=='prep'||S.bells<2||bankN()>=BANK)return;S.bells-=2;S.pity++;
  let g;if(S.pity>=10)g=Math.random()<0.25?2:1;else{const r=Math.random()*100;g=r<GR[0].w?0:r<GR[0].w+GR[1].w?1:2;}
  if(g>=1)S.pity=0;
  const c=genCard(role,g);S.roster.push(c);selRole=role;selCard=c.id;persist();
  showCard('<h2>딸랑딸랑...</h2><img class="bell" src="'+iconURL('bell')+'">');
  setTimeout(()=>{
    const T=c.trait?TR[c.trait]:null;
    showCard('<h2>새 직원이 왔어요!</h2><div class="gcard" style="border-color:'+GR[g].col+(g===2?';box-shadow:0 0 18px '+GR[g].col:'')+'"><img class="big-pet" src="'+petURL(ROLES[role].pet)+'"><div><b style="font-size:18px">'+c.name+'</b> '+ROLES[role].n+'</div><div style="margin:4px 0">'+chip(c)+(T?'<span class="chip" style="background:#b57edc">'+T.n+'</span>':'')+'</div><small>'+statLine(c)+'</small></div><p>보관함에 들어갔어요. 코인으로 배치하면 일을 시작해요.</p><button class="big" id="ok-card">확인</button>');
    lastHTML='';renderList(true);
  },900);
}
function doBuy(id){
  const p=id.split(':');if(p[0]!=='rl')relPend=null;if(p[0]!=='mg')mgPend=null;const pay=c=>{if(S.money<c)return false;S.money-=c;return true;};
  if(p[0]==='pull'){pull(p[1]);return;}
  if(p[0]==='em'){const c=ING[p[1]].c*15;if(pay(c))S.stock[p[1]]=(S.stock[p[1]]||0)+5;}
  else if(id==='rec'){const rec=recMap(),c=recCost();if(c>0&&pay(c))Object.keys(rec).forEach(g=>{S.stock[g]=Math.max(S.stock[g]||0,rec[g]);});}
  else if(p[0]==='o'){const c=ING[p[1]].c*(+p[2]);if(pay(c))S.stock[p[1]]=(S.stock[p[1]]||0)+(+p[2]);}
  else if(p[0]==='dv'){if(pay(MENU[p[1]].dev))S.dev.push(p[1]);}
  else if(p[0]==='bd'){const i=S.board.indexOf(p[1]);if(i>=0){if(S.board.length>1)S.board.splice(i,1);}else if(S.board.length<S.slots)S.board.push(p[1]);}
  else if(p[0]==='dp'){const c=cardById(+p[1]);if(c&&pay(deployCost(c))){const arr=S.deployed[c.role];if(+p[2]>=arr.length)arr.push(c.id);else arr[+p[2]]=c.id;selCard=null;syncActors();}}
  else if(p[0]==='mg'){const src=cardById(+p[1]),t=cardById(+p[2]);if(src&&t&&src.role===t.role&&deployedIds().indexOf(src.id)<0&&(t.mg||0)<MGMAX){if(mgPend!==id){mgPend=id;}else{mgPend=null;t.mg=(t.mg||0)+Math.min(MG[src.grade],MGMAX-(t.mg||0));S.roster=S.roster.filter(x=>x.id!==src.id);selCard=null;}}}
  else if(p[0]==='rl'){const c=cardById(+p[1]);if(c&&deployedIds().indexOf(c.id)<0){if(relPend!==c.id){relPend=c.id;}else{relPend=null;S.money+=sellVal(c);S.roster=S.roster.filter(x=>x.id!==c.id);selCard=null;}}}
  else if(p[0]==='su'){const c=cardById(+p[1]);if(!c)return;const k=p[2];const lv=c.up[k]||0,mx=k==='cap'?3:6;const cc=k==='spd'?cost(30,1.7,lv):k==='skl'?cost(40,1.8,lv):cost(60,2,lv);if(lv<mx&&pay(cc))c.up[k]=lv+1;}
  else if(id==='seat'){if(S.seats<6&&pay(S.seats===4?80:160)){S.seats++;BG=null;}}
  else if(id==='stn'){if(S.stations<MAXSTN&&pay(cost(70,2.4,S.stations-1))){S.stations++;syncStations();}}
  else if(id==='slot'){if(S.slots<4&&pay(S.slots===2?120:300))S.slots++;}
  else if(p[0]==='u'){const k=p[1],mx=k==='carry'?4:8;if(S.up[k]<mx&&pay(cost(k==='carry'?30:20,k==='carry'?1.8:1.6,S.up[k])))S.up[k]++;}
  persist();lastHTML='';lastDock='';renderList(true);updateTop();updateDock();
}
$('list').addEventListener('click',e=>{const rt=e.target.closest('[data-rt]');if(rt){selRole=rt.dataset.rt;selCard=null;lastHTML='';renderList(true);return;}const sl=e.target.closest('[data-sel]');if(sl){const id=+sl.dataset.sel;selCard=selCard===id?null:id;relPend=null;mgPend=null;lastHTML='';renderList(true);return;}const bt=e.target.closest('.buy');if(!bt||bt.disabled)return;doBuy(bt.dataset.id);});
$('alert').addEventListener('click',e=>{const bt=e.target.closest('.buy');if(!bt||bt.disabled)return;doBuy(bt.dataset.id);});
$('qbtn').addEventListener('click',()=>{if(quickId)doBuy(quickId);});
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.open;setTabs();$('sheet').classList.add('open');lastHTML='';renderList(true);}));
$('sx').addEventListener('click',()=>$('sheet').classList.remove('open'));
let toastT=null;
$('bellpill').addEventListener('click',()=>{const el=$('toast');el.textContent='🔔 방울은 직원 뽑기에 쓰는 재화예요. 하루 목표를 달성하거나 평판이 좋으면 받아요. 직원 탭에서 뽑을 수 있어요.';el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{el.style.display='none';},4000);});
$('next').addEventListener('click',startDay);
$('ov').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='ok-card')hideCard();else if(b.id==='go-prep')startPrep();else if(b.id==='start'){if(phase==='title')phase='prep';S.day=Math.max(1,S.day);if(phase==='prep'){phase='day';}startDayFromTitle();}
});
function startDayFromTitle(){phase='day';$('app').classList.remove('prep');$('sheet').classList.remove('open');hideCard();resetDay();resize();setTabs();lastHTML='';}
function showTitle(){
  showCard('<div style="display:flex;justify-content:center;gap:2px"><img width="64" src="'+catURL(0,'happy',true)+'"><img width="64" src="'+catURL(3,'normal')+'"><img width="64" src="'+petURL('hamster')+'"></div><div class="logo">고양이 스낵바</div><p>'+(S.day>1?S.day+'일차부터 이어서 해요.':'작은 가게를 키워 보세요!')+'<br>처음엔 주인(나)이 계산, 요리, 서빙, 청소를 다 해요.<br>번 돈으로 직원을 뽑아 일을 맡겨요.</p><button class="big" id="start">'+(S.day>1?'이어하기':'영업 시작')+'</button>');
}

/* =========================== 루프 =========================== */
let last=performance.now(),uiT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  step(dt);render();updateTop();
  uiT-=dt;if(uiT<=0){renderList(false);updateDock();uiT=0.25;}
  requestAnimationFrame(frame);
}
$('ic-coin').src=iconURL('coin');$('ic-bell').src=iconURL('bell');
document.querySelectorAll('img[data-i]').forEach(i=>{i.src=iconURL(i.dataset.i);});
resize();setTabs();renderList(true);showTitle();
requestAnimationFrame(frame);
window.__dbg={get S(){return S;},step:step,seats:seats,stations:stations,get actors(){return actors;},player:player,cats:()=>cats,get phase(){return phase;},D:()=>D,setDir:d=>{dbgDir=d;},syncActors:syncActors,jobs:()=>jobs,shelf:()=>shelf};
})();
</script>
